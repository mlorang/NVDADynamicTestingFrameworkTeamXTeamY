<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ticker (negative control)</title>
  <!-- Negative control: DOM changes constantly, nothing a11y-relevant happens. Expect no findings. -->
</head>
<body>
  <main>
    <h1>Ticker</h1>
    <p>Updated: <span id="clock"></span></p>
  </main>
  <script>
    const clock = document.getElementById('clock');
    setInterval(() => clock.textContent = new Date().toLocaleTimeString(), 1000);
  </script>
</body>
</html>
