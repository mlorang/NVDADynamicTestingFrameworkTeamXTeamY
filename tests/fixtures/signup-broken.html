<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signup form (broken)</title>
  <!--
    EXPECTED OUTCOME (oracle):
    - Load scan: clean (bugs only exist after submit)
    - After submit, axe should report:
        color-contrast (WCAG 1.4.3 AA): #f88 on white is ~2.3:1, needs 4.5:1
        possibly aria-valid-attr-value (aria-describedby -> missing id): VERIFY
    - After submit, axe will NOT report (manual/NVDA layer only):
        no live region -> NVDA stays silent (WCAG 4.1.3)
        aria-invalid never set -> field not announced as invalid (WCAG 3.3.1)
  -->
</head>
<body>
  <main>
    <h1>Sign up</h1>
    <form id="signup" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email">
      <button type="submit">Sign up</button>
    </form>
  </main>
  <script>
    document.getElementById('signup').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('email');
      if (!input.value.includes('@')) {
        // BUG 1: error element created on the fly, no role="alert" -> not announced
        const err = document.createElement('span');
        err.textContent = 'Enter a valid email address.';
        // BUG 2: insufficient contrast
        err.style.color = '#f88';
        input.after(err);
        // BUG 3: points at an id that doesn't exist; error isn't programmatically tied to the field
        input.setAttribute('aria-describedby', 'email-err');
        // BUG 4: aria-invalid deliberately NOT set
      }
    });
  </script>
</body>
</html>
